[project]
name = "cti"
version = "0.1.0"
description = "Pre-registered backtest: does copying insider and congressional purchases beat the market?"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=16",
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "requests>=2.32",
    "typer>=0.12",
]

[project.optional-dependencies]
app = ["streamlit>=1.38"]

[project.scripts]
cti = "cti.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cti"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # typer.Option in defaults is the documented Typer idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # inline TSV fixtures
