# Pre-registration for copy-the-insiders.
# Every rule the pipeline uses is read from this file. Do not hard-code rules elsewhere.
# The SHA-256 of this file (line endings normalized to \n) is recorded in git tag prereg-v1.
version: 1

periods:
  dev:     {start: 2014-01-01, end: 2021-12-31}
  test:    {start: 2022-01-01, end: 2026-06-30}
  forward: {start: 2026-07-01}

universe:
  min_price: 5                   # nominal close on the last trading day before entry
  min_mcap_usd: 300_000_000      # SEC cover-page shares x that close
  us_listed_common: true
  exchanges: [NYSE, Nasdaq, CBOE, TXSE]   # SEC ticker map (current listing); OTC and unknown excluded
  shares_lag_days: 14            # a cover-page share count is usable 14 days after its date
  shares_fallback_lag_days: 90   # weighted-average basic shares (10-Q/10-K), for multi-class filers
  shares_max_age_days: 400       # older share counts count as unknown
  mcap_unknown: exclude

groups:
  insider:
    codes: [P]
    roles: [officer, director]
    exclude_10b5_1: true
    min_value_usd: 10_000
    # Form 4 SECURITY_TITLE matched case-insensitively; matches are not common stock and are dropped.
    security_title_exclude_regex: 'preferred|depositary|warrant|\bnotes?\b|debenture|\bfund\b|\brights?\b|\bunits?\b|option'
    entry: next_open_after_filed_date
  congress:
    asset_types: [common_stock]
    entry: next_open_after_filed_date

portfolio:
  weighting: equal
  rebalance: on_entry_or_exit     # rebalance to equal weight on any day a position opens or closes
  hold_trading_days: 126
  early_exit_on_filer_sale: true
  one_position_per_ticker: true   # a repeat buy signal on a held ticker does NOT reset the hold clock
  cash_return: TBILL
  starting_nav: 1.0

data:
  price_source: yfinance         # PROTOTYPE ONLY: survivors-only. Swap to crsp or a vendor before tagging.
  price_history_start: 2013-12-01

resolution:
  # Reported Form 4 price vs that day's quoted close. Catches ticker reuse and data-entry errors.
  price_check_tight_pct: 0.25    # within +/-25%: medium/high confidence
  price_check_max_ratio: 2.0     # beyond 2x either way: unmatched (price_mismatch)
  min_price_history_days: 20     # yfinance returns 1-day stubs for delisted tickers; those don't count as priced
  audit_sample_size: 100
  audit_seed: 20260101

delisting:
  acquired: deal_price
  other: last_price
  no_price: -1.0

costs:
  base_bps_per_side: 10
  stress_bps_per_side: 25

benchmarks:
  primary: SPY_TR
  secondary: sector_clone_monthly

inference:
  ci: block_bootstrap
  block_months: 6
  reps: 10000
  alpha: 0.05
  multiple_testing: holm
  seed: 20260101

decision_rule:
  beats: "adj_ci_low > 0"
  rules_out: "adj_ci_high < 0.02"

sensitivity:
  congress_sizing: [low, mid, high]
  costs: [base, stress]
  hold_trading_days: [63, 126]
